[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raimonitor"
version = "0.3.0"
description = "Responsible AI monitoring dashboard: rolling fairness metrics, drift detection, and alerting over production AI decision logs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ram Charan Satya Sai Teja Polisetti" }]
keywords = ["ai-governance", "responsible-ai", "fairness", "monitoring", "drift-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
report = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
raimonitor = "raimonitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
