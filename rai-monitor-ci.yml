name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Quickstart smoke test
        run: |
          python -m raimonitor.cli run --input examples/sample_decisions.csv \
            --format decision_log --window 7D \
            --rules examples/sample_rules.json --out-dir /tmp/smoke
          test -f /tmp/smoke/report.html
